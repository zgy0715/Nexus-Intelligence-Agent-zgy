[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nia"
version = "1.0.0"
description = "Nexus Intelligence Agent - 智能网络爬虫与情报分析系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "scrapy>=2.11.0",
    "scrapy-redis>=0.7.0",
    "crawl4ai>=0.3.0",
    "nest-asyncio>=1.6.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-ollama>=0.1.0",
    "langchain-community>=0.0.10",
    "ollama>=0.1.0",
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "faiss-cpu>=1.7.0",
    "ddddocr>=1.5.0",
    "Pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "fake-useragent>=1.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["nia*", "demo*"]

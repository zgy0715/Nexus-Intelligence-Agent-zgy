version: "3.8"

services:
  # ── Redis（缓存 + SSE 进度推送） ──────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL（爬取结果 + 聊天记录存储） ─────────────────────────────
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nia-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nia}
      MYSQL_USER: ${MYSQL_USER:-nia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nia}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API 服务（FastAPI + 前端静态文件） ───────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      # 持久化 FAISS 索引与 embedding 模型缓存（否则每次重建容器都要重新下载模型）
      - app_data:/app/data
    environment:
      # LLM 配置
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_LLM_MODEL: ${DEEPSEEK_LLM_MODEL:-deepseek-chat}

      # Embedding —— 默认本地 fastembed（无需 Ollama），不要指向 bge-m3（fastembed 不支持）
      EMBED_PROVIDER: ${EMBED_PROVIDER:-fastembed}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      FASTEMBED_CACHE_DIR: /app/data/fastembed
      # 国内网络可设为 https://hf-mirror.com
      HF_ENDPOINT: ${HF_ENDPOINT:-}

      # 向量存储 —— 默认本地 FAISS（无需额外服务）
      VECTOR_STORE: ${VECTOR_STORE:-faiss}
      FAISS_INDEX_PATH: /app/data/faiss_index

      # 基础设施
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MYSQL_URL: ${MYSQL_URL:-mysql+pymysql://nia:nia@mysql:3306/nia?charset=utf8mb4}

      # CORS — 生产环境应设置为具体域名
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      # 部署到公网务必设置：所有 /api/* 请求需带 X-API-Token 头
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  redis_data:
  mysql_data:
  app_data:
